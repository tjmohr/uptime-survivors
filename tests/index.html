<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Survivors Tests</title>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; background: #05080f; color: #d7e3f4; padding: 16px; }
    .pass { color: #4ade80; } .fail { color: #f87171; }
    li { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Uptime Survivors — tests</h1>
  <p id="summary">Running…</p>
  <ul id="failures"></ul>
  <script type="module">
    import { runAll } from './harness.js';
    import { testFiles } from './files.js';
    const summary = document.getElementById('summary');
    try {
      for (const f of testFiles) await import(f);
      const r = await runAll();
      summary.className = r.ok ? 'pass' : 'fail';
      summary.textContent = `RESULT: ${r.ok ? 'PASS' : 'FAIL'} — ${r.passed} passed, ${r.failed} failed, ${r.total} total` +
        (r.total === 0 ? ' (no tests found — counted as failure)' : '');
      const ul = document.getElementById('failures');
      for (const f of r.failures) {
        const li = document.createElement('li');
        li.className = 'fail';
        li.textContent = `${f.name}: ${f.message}`;
        ul.append(li);
      }
    } catch (err) {
      summary.className = 'fail';
      summary.textContent = 'RESULT: FAIL — test runner error: ' + err.message;
    }
  </script>
</body>
</html>
