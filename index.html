<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uptime Survivors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Uptime Survivors play field"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-row hud-top">
      <div class="meter">
        <span class="meter-label">UPTIME</span>
        <div class="bar"><div id="hud-uptime-bar" class="bar-fill bar-uptime"></div></div>
        <span id="hud-uptime" class="meter-value">100%</span>
      </div>
      <div class="hud-center">
        <div id="hud-difficulty">Difficulty 1 / 20</div>
        <div id="hud-level-time" class="hud-dim">60s left</div>
      </div>
      <div class="hud-right">
        <div id="hud-time">00:00</div>
        <div id="hud-sound" class="hud-sound">♪ Sound on (M)</div>
        <div id="hud-test" class="hud-test" hidden></div>
      </div>
    </div>
    <div class="hud-row">
      <div class="meter meter-wide">
        <span id="hud-level" class="meter-label">LVL 1</span>
        <div class="bar"><div id="hud-telemetry-bar" class="bar-fill bar-telemetry"></div></div>
      </div>
    </div>
    <div id="hud-incidents" class="hud-incidents" hidden></div>
    <div id="hud-link-warning" class="hud-link-warning" hidden></div>
    <ul id="hud-loadout" class="loadout" aria-label="Owned tools and passives"></ul>
    <div class="touch-buttons">
      <button id="touch-pause" class="touch-btn" type="button" aria-label="Pause">❚❚</button>
      <button id="touch-sound" class="touch-btn" type="button" aria-label="Sound" aria-pressed="true">♪</button>
    </div>
  </div>

  <div id="joystick" class="joystick" aria-hidden="true"><div class="joystick-knob"></div></div>
  <div id="rotate-hint" class="rotate-hint" aria-hidden="true">Rotate your device for more room</div>

  <!-- Banners and standing incident alerts stack in one column so a two-line banner never covers an alert. -->
  <div class="notices">
    <div id="banner" class="banner" hidden></div>
    <div id="incident-alerts" class="incident-alerts" aria-hidden="true"></div>
  </div>
  <div id="overlay" class="overlay"></div>
  <div id="live" class="visually-hidden" aria-live="polite"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
